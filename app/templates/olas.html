{% extends 'base.html' %}

{% block content %}
    <div id="map-container" style="width: 100%; height: 100vh; position: fixed; top: 0; left: 0;">
        {{ mapa_html | safe }}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const mapContainer = document.querySelector('.folium-map');
            if (mapContainer) {
                const mapId = mapContainer.id;
                // Esperar a que Folium inicialice el objeto global
                const interval = setInterval(() => {
                    if (window[mapId]) {
                        clearInterval(interval);
                        const map = window[mapId];

                        map.on('moveend', () => {
                            const center = map.getCenter();
                            const zoom = map.getZoom();

                            fetch('/app/actualizar_mapa', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    center: [center.lat, center.lng],
                                    zoom: zoom
                                })
                            })
                            .catch(err => console.error('Error al sincronizar mapa:', err));
                        });
                    }
                }, 100);
            }
        });
    </script>
{% endblock %}
