<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
            padding: 30px;
        }
        h1 {
            font-size: 2rem;
            color: #dc3545;
        }
        p {
            color: #6c757d;
            margin: 15px 0;
        }
        .details {
            font-size: 0.9rem;
            color: #212529;
            background: #f8d7da;
            padding: 10px;
            border: 1px solid #f5c2c7;
            border-radius: 5px;
            margin-top: 20px;
            text-align: left;
            white-space: pre-wrap;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Ups! Ocurrió un error inesperado</h1>
        <p>Lo sentimos, algo salió mal al procesar tu solicitud.</p>
        <p>Puedes intentar nuevamente o regresar a la página de inicio.</p>

        {% if mensaje %}
        <div class="details">
            <strong>Detalles técnicos:</strong><br>
            {{ mensaje }}
        </div>
        {% endif %}

        <a href="/">Volver al Inicio</a>
    </div>
</body>
</html>
